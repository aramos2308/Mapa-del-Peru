<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa del Perú por regiones</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --fondo: #f7f2ef;
      --texto: #083344;
      --subtexto: #475569;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fondo);
    }

    .tarjeta-mapa {
      width: 100vw;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0;
    }

    #mapa {
      width: 100%;
      height: 96vh;
      min-height: 720px;
    }
    
    .leaflet-container { background: transparent !important; }

    /* Etiquetas de regiones uniformes */
    .region-label {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      box-shadow: none;
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
      line-height: 1.1;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7), 0 0 4px rgba(0, 0, 0, 0.4);
      white-space: normal;
      max-width: 85px;
      padding: 2px 4px;
      border-radius: 4px;
      pointer-events: none;
    }

    /* Excepciones compactas para evitar colisiones */
    .region-label.compacta {
      font-size: 12px;
      max-width: 65px;
    }

    .leaflet-tooltip-top::before, .leaflet-tooltip-bottom::before,
    .leaflet-tooltip-left::before, .leaflet-tooltip-right::before {
      display: none;
    }

    /* Tarjeta flotante (Tooltip de información) */
    .info-card {
      position: absolute;
      z-index: 1000;
      min-width: 190px;
      max-width: 240px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
      color: #0f172a;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.1s ease, transform 0.1s ease;
    }

    .info-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .info-card__titulo { margin: 0 0 4px; color: var(--texto); font-size: 14px; font-weight: 800; }
    .info-card__subtitulo { margin: 0 0 6px; color: #64748b; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .info-card__lista { margin: 0; padding-left: 14px; color: #334155; font-size: 11.5px; line-height: 1.4; }

    /* Marcador Pin / Foco Estilizado */
    .cite-pin {
      width: 14px;
      height: 14px;
      position: relative;
      background: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 4px 8px rgba(15, 23, 42, 0.3);
      cursor: pointer;
    }

    .cite-pin::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      top: 3px;
      left: 3px;
      background: #ffffff;
      border-radius: 50%;
    }

    .cite-pin-marker { z-index: 900 !important; }

    @media (max-width: 768px) {
      #mapa { height: 70vh; min-height: 500px; }
      .region-label { font-size: 8px; max-width: 50px; }
      .region-label.compacta { font-size: 7px; max-width: 40px; }
    }
  </style>
</head>

<body>
  <div class="tarjeta-mapa">
    <div id="mapa"></div>
    <div id="infoCard" class="info-card"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <script>
    const mapa = L.map("mapa", {
      minZoom: 5, maxZoom: 9, zoomSnap: 0.5, zoomDelta: 0.5
    });

    mapa.createPane("pinPane").style.zIndex = 750;
    const infoCard = document.getElementById("infoCard");

    const geojsonDepartamentosUrl = "https://raw.githubusercontent.com/juaneladio/peru-geojson/master/peru_departamental_simple.geojson";
    const geojsonProvinciasUrl = "https://raw.githubusercontent.com/juaneladio/peru-geojson/master/peru_provincial_simple.geojson";

    const coloresPorRegion = {
      "AMAZONAS": "#14B8A6", "ANCASH": "#F97316", "APURIMAC": "#FF0000", "AREQUIPA": "#3EFADD",
      "AYACUCHO": "#A855F7", "CAJAMARCA": "#C2DB00", "CALLAO": "#8B5CF6", "CUSCO": "#FFEA30",
      "HUANCAVELICA": "#22C55E", "HUANUCO": "#F43F5E", "ICA": "#F97316", "JUNIN": "#F59E0B",
      "LA LIBERTAD": "#A855F7", "LAMBAYEQUE": "#FF29B8", "LIMA METROPOLITANA": "#7C3AED",
      "LIMA PROVINCIAS": "#38BDF8", "LORETO": "#0DD12E", "MADRE DE DIOS": "#EC4899",
      "MOQUEGUA": "#003CFF", "PASCO": "#C084FC", "PIURA": "#38BDF8", "PUNO": "#95D902",
      "SAN MARTIN": "#38BDF8", "TACNA": "#A855F7", "TUMBES": "#06B6D4", "UCAYALI": "#3131E8"
    };

    const nombresConTildes = {
      "AMAZONAS": "Amazonas", "ANCASH": "Áncash", "APURIMAC": "Apurímac", "AREQUIPA": "Arequipa",
      "AYACUCHO": "Ayacucho", "CAJAMARCA": "Cajamarca", "CALLAO": "Callao", "CUSCO": "Cusco",
      "HUANCAVELICA": "Huancavelica", "HUANUCO": "Huánuco", "ICA": "Ica", "JUNIN": "Junín",
      "LA LIBERTAD": "La Libertad", "LAMBAYEQUE": "Lambayeque", "LIMA METROPOLITANA": "Lima Metropolitana",
      "LIMA PROVINCIAS": "Lima Provincias", "LORETO": "Loreto", "MADRE DE DIOS": "Madre de Dios",
      "MOQUEGUA": "Moquegua", "PASCO": "Pasco", "PIURA": "Piura", "PUNO": "Puno",
      "SAN MARTIN": "San Martín", "TACNA": "Tacna", "TUMBES": "Tumbes", "UCAYALI": "Ucayali"
    };

    const citesPorRegion = {
      "AREQUIPA": ["CITEagroindustrial Majes", "CITEcuero y calzado Arequipa", "CITEtextil camélidos Arequipa"],
      "AYACUCHO": ["UTagroindustrial Ayacucho"], "CAJAMARCA": ["UTmadera Cajamarca"],
      "CALLAO": ["CITEpesquero, acuícola, agroindustrial Callao"],
      "CUSCO": ["CITEproductivo VRAEM", "CITEtextil camélidos Cusco"],
      "HUANCAVELICA": ["UTacuícola pesquero Huancavelica", "CITEtextil camélidos Huancavelica"],
      "HUANUCO": ["CITEagroindustrial Huallaga", "UTagroindustrial Ambo"], "ICA": ["CITEagroindustrial Ica"],
      "JUNIN": ["UTcuero y calzado Junín"], "LA LIBERTAD": ["CITEagroindustrial Chavimochic", "CITEcuero y calzado Trujillo"],
      "LAMBAYEQUE": ["UTagroindustrial Lambayeque"],
      "LIMA METROPOLITANA": ["CITEcuero, calzado, textil y confecciones Lima", "CITEmadera y del mueble Lima", "UTtextil y confecciones Lima", "DEDFO", "OPPM", "OGrrhh", "Dirección Ejecutiva", "DSE", "OTI", "DIDITT"],
      "LIMA PROVINCIAS": ["UTagroindustrial Huaura"], "LORETO": ["CITEforestal Maynas", "CITEproductivo Maynas"],
      "MADRE DE DIOS": ["CITEproductivo Madre de Dios"], "MOQUEGUA": ["CITEagroindustrial Moquegua", "CITEpesquero Ilo"],
      "PASCO": ["CITEagroindustrial Oxapampa"], "PIURA": ["CITEpesquero, acuícola, agroindustrial Piura"],
      "PUNO": ["CITEacuícola Puno", "CITEtextil camélidos Puno"], "SAN MARTIN": ["CITEproductivo San Martín"],
      "TACNA": ["UTagroindustrial Tacna"], "UCAYALI": ["CITEforestal Pucallpa", "CITEproductivo Pucallpa"]
    };

    const normalizar = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toUpperCase();
    const obtenerDepartamento = f => normalizar(f.properties.NOMBDEP || f.properties.FIRST_NOMB || f.properties.DEPARTAMENTO || f.properties.DEPARTAM);
    const obtenerProvincia = f => normalizar(f.properties.NOMBPROV || f.properties.PROVINCIA);
    const obtenerNombreNormalizado = f => normalizar(f.properties._nombreMapa || f.properties.NOMBDEP);
    const obtenerNombreMapa = f => nombresConTildes[obtenerNombreNormalizado(f)] || obtenerNombreNormalizado(f);
    const obtenerCites = n => citesPorRegion[n] || ["Sin Datos"];
    const tieneCitesActivos = n => citesPorRegion[n] && citesPorRegion[n][0] !== "Sin Datos";

    // Ubica el pin inteligentemente para que no tape los textos (Especialmente Loreto)
    function obtenerPuntoInterno(feature, nombre) {
      const centro = turf.centroid(feature).geometry.coordinates;
      const puntoInterno = turf.pointOnFeature(feature).geometry.coordinates;
      
      let lng = puntoInterno[0] + (centro[0] - puntoInterno[0]) * 0.2;
      let lat = puntoInterno[1] + (centro[1] - puntoInterno[1]) * 0.2;

      if (nombre === "LORETO") { return [lat + 0.45, lng - 0.45]; } // Mueve el pin lejos de la etiqueta central
      if (nombre === "SAN MARTIN") { return [lat - 0.15, lng + 0.15]; }
      
      return [lat + 0.08, lng + 0.08];
    }

    function unirPoligonos(features, nombreMapa) {
      if (!features.length) return null;
      let unido = features[0];
      for (let i = 1; i < features.length; i++) {
        try { unido = turf.union(unido, features[i]); } catch (e) { console.warn(e); }
      }
      unido.properties = { _nombreMapa: nombreMapa };
      return unido;
    }

    function dividirNombreParaEtiqueta(nombreRegion) {
      return nombreRegion
        .replace("Lima Metropolitana", "Lima<br>Metrop.")
        .replace("Lima Provincias", "Lima<br>Prov.")
        .replace("Madre de Dios", "Madre<br>de Dios")
        .replace("La Libertad", "La<br>Libertad")
        .replace("San Martín", "San<br>Martín")
        .replace("Huancavelica", "Huanca<br>velica");
    }

    function crearEtiqueta(layer, nombreRegion) {
      const regionesConflictivas = ["Callao", "Lima Metropolitana", "Lima Provincias", "Tumbes", "Moquegua", "Tacna", "Pasco", "San Martín", "Huancavelica", "Madre de Dios"];
      let clase = "region-label" + (regionesConflictivas.includes(nombreRegion) ? " compacta" : "");

      layer.bindTooltip(dividirNombreParaEtiqueta(nombreRegion), {
        permanent: true, direction: "center", className: clase, opacity: 0.95
      });
    }

    function gestionarTarjeta(e, nombreNormalizado, nombreRegion, mostrar) {
      if (!mostrar) { infoCard.classList.remove("visible"); return; }
      
      const lista = obtenerCites(nombreNormalizado).map(c => `<li>${c}</li>`).join("");
      infoCard.innerHTML = `<p class="info-card__titulo">${nombreRegion}</p><p class="info-card__subtitulo">CITES/UT</p><ul class="info-card__lista">${lista}</ul>`;
      
      moverTarjeta(e);
      infoCard.classList.add("visible");
    }

    function moverTarjeta(e) {
      const contenedor = document.querySelector(".tarjeta-mapa");
      const rect = contenedor.getBoundingClientRect();
      let x = e.clientX - rect.left + 15, y = e.clientY - rect.top + 15;

      if (x + 200 > rect.width) x = e.clientX - rect.left - 210;
      if (y + 150 > rect.height) y = e.clientY - rect.top - 160;

      infoCard.style.left = `${Math.max(10, x)}px`;
      infoCard.style.top = `${Math.max(10, y)}px`;
    }

    Promise.all([
      fetch(geojsonDepartamentosUrl).then(res => res.json()),
      fetch(geojsonProvinciasUrl).then(res => res.json())
    ]).then(([departamentos, provincias]) => {
      const featuresFinales = [];

      departamentos.features.forEach(f => {
        const dep = obtenerDepartamento(f);
        if (dep !== "LIMA") { f.properties._nombreMapa = dep; featuresFinales.push(f); }
      });

      const provsLima = provincias.features.filter(f => obtenerDepartamento(f) === "LIMA");
      const limaMetro = provsLima.find(f => obtenerProvincia(f) === "LIMA");
      if (limaMetro) { limaMetro.properties._nombreMapa = "LIMA METROPOLITANA"; featuresFinales.push(limaMetro); }

      const limaProv = unirPoligonos(provsLima.filter(f => obtenerProvincia(f) !== "LIMA"), "LIMA PROVINCIAS");
      if (limaProv) featuresFinales.push(limaProv);

      const geojsonFinal = { type: "FeatureCollection", features: featuresFinales };

      const capaPeru = L.geoJSON(geojsonFinal, {
        style: f => ({
          fillColor: coloresPorRegion[obtenerNombreNormalizado(f)] || "#14B8A6",
          fillOpacity: 1, color: "#ffffff", weight: 2.5, opacity: 1
        }),
        onEachFeature: (f, layer) => {
          const norm = obtenerNombreNormalizado(f), mapaNom = obtenerNombreMapa(f);
          crearEtiqueta(layer, mapaNom);

          layer.on({
            mouseover: e => {
              e.target.setStyle({ weight: 4.5, fillOpacity: 0.9 });
              gestionarTarjeta(e.originalEvent, norm, mapaNom, true);
            },
            mousemove: e => moverTarjeta(e.originalEvent),
            mouseout: e => { capaPeru.resetStyle(e.target); gestionarTarjeta(null, null, null, false); }
          });
        }
      }).addTo(mapa);

      // Renderizado dinámico de Pines sobre Capa Especial
      geojsonFinal.features.forEach(f => {
        const norm = obtenerNombreNormalizado(f);
        if (!tieneCitesActivos(norm)) return;

        const mapaNom = obtenerNombreMapa(f);
        const marcador = L.marker(obtenerPuntoInterno(f, norm), {
          icon: L.divIcon({ className: "cite-pin-marker", html: '<div class="cite-pin"></div>', iconSize: [14, 14], iconAnchor: [7, 13] }),
          pane: "pinPane"
        }).addTo(mapa);

        marcador.on({
          mouseover: e => gestionarTarjeta(e.originalEvent, norm, mapaNom, true),
          mousemove: e => moverTarjeta(e.originalEvent),
          mouseout: () => gestionarTarjeta(null, null, null, false)
        });
      });

      mapa.fitBounds(capaPeru.getBounds(), { padding: [10, 10] });
    }).catch(err => {
      console.error(err);
      document.getElementById("mapa").innerHTML = "<p style='text-align:center; padding-top:40px; color:#ef4444; font-weight:bold;'>Error al cargar las capas del mapa.</p>";
    });
  </script>
</body>
</html>
